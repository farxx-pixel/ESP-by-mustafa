name: Build CODM ESP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate gradlew
        run: gradle wrapper --gradle-version 8.4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find and sign APK
        run: |
          SIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          $SIGNER sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/codm-esp-signed.apk \
            $UNSIGNED

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CODM-ESP-APK
          path: app/build/outputs/apk/release/codm-esp-signed.apk
          retention-days: 30
